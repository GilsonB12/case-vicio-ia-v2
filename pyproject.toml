[project]
name = "sistema-vicio"
version = "0.2.0"
description = "Sistema de classificação de questões jurídicas em temas, sem modelo de linguagem na decisão (case Vício, etapa 2)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "rank-bm25>=0.2",
  "joblib>=1.4",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "openai>=1.50",
  "tiktoken>=0.8",
]

[project.scripts]
sistema = "sistema.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sistema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
